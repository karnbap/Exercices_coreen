name: Fix particules lesson once

on:
  push:
    paths:
      - '.github/workflows/fix-particules-once.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch lesson and result email flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def rep(text, old, new, label, count=1):
              found = text.count(old)
              if found < count:
                  raise SystemExit(f"Missing replacement target: {label} (found {found}, need {count})")
              return text.replace(old, new, count)

          path = Path('assignments/Particules_sujet_objet_00.html')
          s = path.read_text(encoding='utf-8')

          s = rep(s,
          """  #accueil-eleve input:focus{outline:none; border-color:var(--sujet);}\n""",
          """  #accueil-eleve input:focus{outline:none; border-color:var(--sujet);}\n  .identite-ligne{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;}\n  .identite-ligne #bonjour-eleve{margin:6px 0;}\n  .btn-lien{border:0; background:transparent; color:var(--sujet); text-decoration:underline; cursor:pointer; padding:4px 0; font:inherit; font-size:.85rem;}\n""", 'identity css')

          s = rep(s,
          """    <p style=\"margin-top:0;\">Dis-nous qui tu es : tes résultats pourront t'être envoyés par email (et le chat saura à qui ronronner dessus 🐱).</p>""",
          """    <p style=\"margin-top:0;\">Dis-nous qui tu es : tes résultats pourront t'être envoyés par email.</p>\n    <p class=\"niveau-info\" style=\"margin-bottom:12px;\">Cet appareil te reconnaîtra automatiquement la prochaine fois. Tu pourras changer d'élève à tout moment.</p>""", 'welcome copy')

          s = rep(s, '<h1>La structure basique : le coréen vs le français</h1>', '<h1>La structure de base : le coréen vs le français</h1>', 'title copy')
          s = rep(s, "<h2>1️⃣ L'ordre des mots : le verbe à la fin !</h2>", "<h2>1️⃣ L'ordre des mots : le verbe généralement à la fin</h2>", 'word order heading')
          s = rep(s,
          """        En coréen, <strong>le verbe est toujours à la fin de la phrase</strong>. On place d'abord les noms (avec leurs particules), puis l'action.""",
          """        En coréen, <strong>le prédicat (verbe ou adjectif) se place généralement à la fin de la phrase</strong>. Pour commencer, retiens le schéma simple : noms + particules, puis prédicat.""", 'absolute verb rule')
          s = rep(s,
          """        Chaque nom est accompagné d'une petite particule qui indique <strong>son rôle</strong> dans la phrase : sujet, objet, lieu, temps… Grâce à elles, on sait immédiatement qui fait quoi, <strong>quel que soit l'ordre des mots</strong>.""",
          """        Les noms <strong>peuvent être suivis</strong> de petites particules qui indiquent leur rôle dans la phrase : sujet, objet, lieu, temps… Grâce à elles, le rôle des mots reste souvent clair <strong>même lorsque l'ordre varie</strong>.""", 'particle nuance')
          s = rep(s,
          """        제<span class=\"particule\">가</span><span class=\"role\">Sujet</span> 폴이에요. — <em>Je suis Paul.</em> (De qui parle-t-on ? → de moi, qu'on décrit !)""",
          """        누가 폴이에요? — 제<span class=\"particule\">가</span><span class=\"role\">Sujet</span> 폴이에요. — <em>Qui est Paul ? — C'est moi.</em> (Ici, 제가 met l'accent sur « moi ».)""", 'jega context')
          s = rep(s,
          'rappel: "<strong>Rappel :</strong> ordre coréen → <b>Sujet + Objet + Verbe</b>. Le verbe est toujours à la fin !",',
          'rappel: "<strong>Rappel :</strong> pour ces phrases d’entraînement → <b>Sujet + Objet + Verbe</b>. Le verbe vient à la fin.",', 'level 4 reminder')

          s = rep(s,
          """    <p class=\"niveau-info\" id=\"bonjour-eleve\"></p>""",
          """    <div class=\"identite-ligne\">\n      <p class=\"niveau-info\" id=\"bonjour-eleve\"></p>\n      <button type=\"button\" class=\"btn-lien\" id=\"btn-changer-eleve\">Ce n'est pas toi ? Changer d'élève</button>\n    </div>""", 'change student ui')
          s = rep(s,
          """        <button id=\"btn-suivant\">⬆️ Niveau suivant</button>""",
          """        <button id=\"btn-suivant\">⬆️ Niveau suivant</button>\n        <button id=\"btn-terminer\">📨 Terminer ma session et envoyer le bilan</button>""", 'finish button')

          s = rep(s,
          """let verifie = false;\n""",
          """let verifie = false;\nlet sessionStartTime = new Date().toISOString();\n""", 'session start state')
          s = rep(s,
          """const actionsEl = document.getElementById(\"actions-exo\");\n""",
          """const actionsEl = document.getElementById(\"actions-exo\");\nconst btnTerminer = document.getElementById(\"btn-terminer\");\nconst btnChangerEleve = document.getElementById(\"btn-changer-eleve\");\n""", 'button refs')

          s = rep(s,
          """function cleMeilleur(niveau) { return \"coreen_particules_meilleur_\" + niveau.id; }\n""",
          """function identifiantEleve() { return eleve && eleve.studentId ? eleve.studentId : \"legacy\"; }\nfunction cleMeilleur(niveau) { return \"coreen_particules_meilleur_\" + identifiantEleve() + \"_\" + niveau.id; }\n""", 'score key')
          s = rep(s, 'const cle = cleMeilleur(niveau);', 'const cle = cleMeilleur(niveau());', 'best score bug')
          s = rep(s,
          'function cleWarmup(niv) { return "coreen_warmup_fait_" + niv.id; }',
          'function cleWarmup(niv) { return "coreen_warmup_fait_" + identifiantEleve() + "_" + niv.id; }', 'warmup key')

          s = rep(s,
          """btnVerifier.addEventListener(\"click\", () => {\n  const niv = niveau();""",
          """btnVerifier.addEventListener(\"click\", () => {\n  if (verifie) return;\n  const niv = niveau();""", 'verify guard')
          s = rep(s,
          """  verifie = true;\n  scoreEl.textContent""",
          """  verifie = true;\n  btnVerifier.disabled = true;\n  scoreEl.textContent""", 'disable verify')
          s = rep(s,
          '  envoyerRapport("fin_d_exercice");',
          '  sauvegarderRapport("fin_d_exercice", construirePayload("fin_d_exercice"));', 'no email per round')

          next_block = """btnSuivant.addEventListener(\"click\", () => {\n  if (niveauActuel < NIVEAUX.length - 1) {\n    niveauActuel++;\n    demarrerNiveau();\n    document.getElementById(\"exercices\").scrollIntoView({ behavior: \"smooth\" });\n  }\n});"""
          next_plus = next_block + """\n\nbtnTerminer.addEventListener(\"click\", async () => {\n  if (btnTerminer.disabled) return;\n  btnTerminer.disabled = true;\n  const ancienTexte = btnTerminer.textContent;\n  btnTerminer.textContent = \"⏳ Envoi du bilan…\";\n  const ok = await envoyerRapport(\"session_complete\");\n  if (ok) {\n    btnTerminer.textContent = \"✅ Bilan envoyé !\";\n    messageEl.textContent = \"Ton bilan a bien été envoyé. Tu peux continuer à t'entraîner si tu veux.\";\n  } else {\n    btnTerminer.disabled = false;\n    btnTerminer.textContent = ancienTexte;\n    messageEl.textContent = \"L'envoi n'a pas fonctionné. Tes progrès restent enregistrés sur cet appareil : réessaie dans un instant.\";\n  }\n});"""
          s = rep(s, next_block, next_plus, 'finish listener')

          s = rep(s,
          """function chargerEleve() {\n  try { eleve = JSON.parse(localStorage.getItem(\"coreen_particules_eleve\") || \"null\"); } catch (e) { eleve = null; }\n}\n""",
          """const CLE_ELEVE_GLOBALE = \"pongdang_student_v1\";\nfunction creerStudentId() {\n  if (window.crypto && typeof window.crypto.randomUUID === \"function\") return window.crypto.randomUUID();\n  return \"student_\" + Date.now().toString(36) + \"_\" + Math.random().toString(36).slice(2, 10);\n}\nfunction normaliserEleve(data) {\n  if (!data || !data.nom || !data.email) return null;\n  return { studentId: data.studentId || creerStudentId(), nom: data.nom, email: data.email };\n}\nfunction chargerEleve() {\n  try {\n    const global = JSON.parse(localStorage.getItem(CLE_ELEVE_GLOBALE) || \"null\");\n    const legacy = JSON.parse(localStorage.getItem(\"coreen_particules_eleve\") || \"null\");\n    eleve = normaliserEleve(global || legacy);\n    if (eleve) {\n      localStorage.setItem(CLE_ELEVE_GLOBALE, JSON.stringify(eleve));\n      localStorage.setItem(\"coreen_particules_eleve\", JSON.stringify(eleve));\n    }\n  } catch (e) { eleve = null; }\n}\n""", 'student loader')
          s = rep(s,
          """  eleve = { nom: nom, email: email };\n  try { localStorage.setItem(\"coreen_particules_eleve\", JSON.stringify(eleve)); } catch (e) { /* sans gravité */ }""",
          """  eleve = { studentId: creerStudentId(), nom: nom, email: email };\n  try {\n    localStorage.setItem(CLE_ELEVE_GLOBALE, JSON.stringify(eleve));\n    localStorage.setItem(\"coreen_particules_eleve\", JSON.stringify(eleve));\n  } catch (e) { /* sans gravité */ }""", 'student save')

          accueil_end = """  document.getElementById(\"accueil-eleve\").hidden = true;\n  initSession();\n});\n\nfunction initSession() {"""
          accueil_plus = """  document.getElementById(\"accueil-eleve\").hidden = true;\n  initSession();\n});\n\nbtnChangerEleve.addEventListener(\"click\", () => {\n  try {\n    localStorage.removeItem(CLE_ELEVE_GLOBALE);\n    localStorage.removeItem(\"coreen_particules_eleve\");\n    for (let i = sessionStorage.length - 1; i >= 0; i--) {\n      const k = sessionStorage.key(i);\n      if (k && k.startsWith(\"coreen_warmup_fait_\")) sessionStorage.removeItem(k);\n    }\n  } catch (e) { /* sans gravité */ }\n  location.reload();\n});\n\nfunction initSession() {"""
          s = rep(s, accueil_end, accueil_plus, 'change student behavior')
          s = rep(s,
          """function initSession() {\n  document.getElementById(\"bonjour-eleve\").textContent =""",
          """function initSession() {\n  sessionStartTime = new Date().toISOString();\n  document.getElementById(\"bonjour-eleve\").textContent =""", 'session start init')

          s = rep(s,
          """    if (!localStorage.getItem(\"coreen_debut_session\")) {\n      localStorage.setItem(\"coreen_debut_session\", new Date().toISOString());\n    }""",
          """    localStorage.setItem(\"coreen_debut_session_\" + identifiantEleve(), sessionStartTime);""", 'session storage key')

          s = rep(s,
          """function chargerStats() {\n  try {\n    return JSON.parse(localStorage.getItem(\"coreen_stats\") || \"null\") ||\n      { premiere_session: null, manches: 0, rounds: [] };\n  } catch (e) { return { premiere_session: null, manches: 0, rounds: [] }; }\n}\nfunction sauverStats(stats) {\n  try { localStorage.setItem(\"coreen_stats\", JSON.stringify(stats)); } catch (e) { /* sans gravité */ }\n}""",
          """function cleStats() { return \"coreen_stats_\" + identifiantEleve(); }\nfunction chargerStats() {\n  try {\n    return JSON.parse(localStorage.getItem(cleStats()) || \"null\") ||\n      { premiere_session: null, manches: 0, rounds: [] };\n  } catch (e) { return { premiere_session: null, manches: 0, rounds: [] }; }\n}\nfunction sauverStats(stats) {\n  try { localStorage.setItem(cleStats(), JSON.stringify(stats)); } catch (e) { /* sans gravité */ }\n}""", 'student scoped stats')

          s = rep(s,
          '    startTime: stats.premiere_session || new Date().toISOString(),',
          '    startTime: sessionStartTime,\n    firstSeenAt: stats.premiere_session || sessionStartTime,', 'payload session start')

          s = rep(s,
          """function envoyerRapport(trigger) {\n  if (!eleve) return;\n  const payload = construirePayload(trigger);\n  sauvegarderRapport(trigger, payload);\n  fetch(SEND_ENDPOINT, {\n    method: \"POST\",\n    headers: { \"Content-Type\": \"application/json\" },\n    body: JSON.stringify(payload)\n  }).catch(() => { /* hors-ligne : le rapport reste sauvegardé localement */ });\n}""",
          """async function envoyerRapport(trigger) {\n  if (!eleve) return false;\n  const payload = construirePayload(trigger);\n  payload.submissionId = identifiantEleve() + \"_\" + Date.now().toString(36);\n  sauvegarderRapport(trigger, payload);\n  try {\n    const response = await fetch(SEND_ENDPOINT, {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"application/json\" },\n      body: JSON.stringify(payload)\n    });\n    return response.ok;\n  } catch (e) {\n    return false;\n  }\n}""", 'async report send')

          s = rep(s,
          'window.addEventListener("pagehide", () => envoyerRapportBeacon("page_fermee"));',
          'window.addEventListener("pagehide", () => sauvegarderRapport("page_fermee", construirePayload("page_fermee")));', 'no pagehide email')
          s = rep(s,
          '  minuteurInactivite = setTimeout(() => envoyerRapport("sans_reponse_1h"), 60 * 60 * 1000);',
          '  minuteurInactivite = setTimeout(() => sauvegarderRapport("sans_reponse_1h", construirePayload("sans_reponse_1h")), 60 * 60 * 1000);', 'no inactivity email')

          path.write_text(s, encoding='utf-8')

          server = Path('netlify/functions/send-results.js')
          t = server.read_text(encoding='utf-8')
          t = rep(t,
          """        fin_d_exercice: \"Fin d'une manche d'exercices\",\n        sans_reponse_1h: '1 heure sans réponse',""",
          """        fin_d_exercice: \"Fin d'une manche d'exercices\",\n        session_complete: 'Session terminée — bilan demandé',\n        sans_reponse_1h: '1 heure sans réponse',""", 'server trigger')
          t = rep(t, '<p><b>Première session :</b> ${fmtDate(startTime)}</p>', '<p><b>Début de cette session :</b> ${fmtDate(startTime)}</p>', 'server session label')
          t = rep(t,
          """      if (studentEmail && /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(studentEmail)) {""",
          """      if (trigger === 'session_complete' && studentEmail && /^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(studentEmail)) {""", 'student email only final')
          server.write_text(t, encoding='utf-8')
          PY

      - name: Validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('assignments/Particules_sujet_objet_00.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          if not scripts:
              raise SystemExit('No inline script found')
          Path('/tmp/particules-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          assert 'cleMeilleur(niveau())' in html
          assert 'pongdang_student_v1' in html
          assert 'session_complete' in html
          assert 'Changer d\'élève' in html
          PY
          node --check /tmp/particules-inline.js
          node --check netlify/functions/send-results.js

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "pongdang-fix-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assignments/Particules_sujet_objet_00.html netlify/functions/send-results.js
          git diff --cached --check
          git commit -m "Fix particules lesson student sessions and reporting"
          git push
